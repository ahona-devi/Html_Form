
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        label {
            display: block;
            color: #444;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 9px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #397c75;
            color: white;
            border: none;
            border-radius: 5px;
            
        }

        a {
            color: #397c75;
            text-decoration: none;
        }
    </style>
</head>

<body style="font-family: Arial; background-color: #e8f0ed; margin: 0;">

    <div style="background-color: white; width: 750px; margin: 100px auto; display: flex;">

        <!-- Welcome Section -->
        <div style="background-color: #397c75; color: white; width: 40%; padding: 25px; text-align: center;">

            <h1 style="font-size: 25px;">Welcome Back!</h1>

            <p>Nice to see you again.</p>

            <p>Login to continue your account.</p>

        </div>

        <!-- Login Form Section -->
        <div style="width: 60%; padding: 30px;">

            <h1 style="text-align: center; color: #397c75;">Login</h1>

            <p style="text-align: center; color: gray;">Enter your information</p>

            <form method="POST">

                <label for="email">Email Address</label>

                <input type="email" id="email" name="email"
                placeholder="Enter your email" required>

                <label for="password">Password</label>

                <input type="password" id="password" name="password"
                placeholder="Enter your password" required>

                <input type="checkbox" id="remember"
                name="remember"
                style="width: auto; padding: 0; margin: 0;">

                <label for="remember" style="display: inline;">Remember Me</label>

                <br><br>

                <button type="submit">Login</button>

            </form>

            <p style="text-align: center; margin-top: 20px;">
                Don't have an account?
                <a href="registration.html">Sign Up</a>
            </p>

        </div>
    </div>

</body>
</html>
